name: Release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dev/**"
      - "dependabot/**"
      - "maven"
    paths-ignore:
      - "README.md"
      - "LICENSE*"

jobs:
  build:
    name: Ubuntu Latest Build
    permissions:
      contents: write
      pages: write
      id-token: write
    strategy:
      matrix:
        java: [
          25,
        ]
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.change_version.outputs.new_version }}
      changelog: ${{ steps.git-cliff2.outputs.content }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: Pull changes
        run: git pull

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pre_release_branches: "dev"

      - name: Ensure tag exists
        run: |
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          
          if [ -z "$TAG" ]; then
            echo "No tag generated!"
            exit 1
          fi

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            echo "Tag $TAG does not exist, creating..."

            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Verify tag exists
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.tag_version.outputs.new_tag }}" >/dev/null 2>&1; then
            echo "Tag exists"
          else
            echo "Tag missing!"
            exit 1
          fi

      - name: Clone `CSharp-Workflow-Scripts` Python script
        run: git clone https://github.com/T2PeNBiX99wcoxKv3A4g/CSharp-Workflow-Scripts.git .scripts

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '>=3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r .scripts/requirements.txt

      - name: Change version in `gradle.properties`
        id: change_version
        run: python .scripts/change_version.py change-version ./gradle.properties version ${{ steps.tag_version.outputs.new_tag }}

      - name: Remove `.scripts`
        run: rm -rf .scripts

      - name: Install `typos-cli` from `crates.io`
        uses: baptiste0928/cargo-install@v3
        with:
          crate: typos-cli

      - name: Pull changes
        run: git pull

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --verbose --config-url https://raw.githubusercontent.com/T2PeNBiX99wcoxKv3A4g/Git-Cliff-Template/refs/heads/master/cliff.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Set git user
        uses: fregante/setup-git-user@v2

      - name: Check for changes
        run: git status

      - name: Stage changed files
        run: git add .

      - name: Commit changed files
        run: "git commit -m 'action: Update version in `gradle.properties`'"

      - name: Fetch updates
        run: git fetch origin ${{ github.ref_name }}

      - name: Push code
        run: git push origin ${{ github.ref_name }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: Pull changes
        run: git pull

      - name: Generate a release body
        uses: orhun/git-cliff-action@v4
        id: git-cliff2
        with:
          args: --verbose --latest --strip header --config-url https://raw.githubusercontent.com/T2PeNBiX99wcoxKv3A4g/Git-Cliff-Template/refs/heads/master/cliff.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

      - name: Build Maven repository
        run: ./gradlew publish

      - name: Upload Maven Repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-repository
          path: build/repo/

      - name: Checkout to Maven repository
        shell: bash
        run: |
          git reset --hard HEAD
          git fetch origin maven:maven || true

          if git show-ref --verify --quiet refs/heads/maven; then
            git checkout maven
          else
            git checkout --orphan maven
            git rm -rf . || true
            git clean -fdx

            printf '%s\n' \
            '<!doctype html>' \
            '<html>' \
            '<head>' \
            '    <meta charset="UTF-8">' \
            '    <title>Maven Repository</title>' \
            '</head>' \
            '<body>' \
            '    <h1>Maven Repository</h1>' \
            '</body>' \
            '</html>' \
            > index.html

            git add index.html
            git commit -m "action: Initialize Maven repository"
          fi

      - name: Download Maven Repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: .maven-repository

      - name: Publish Maven repository
        shell: bash
        run: |
          cp -R .maven-repository/. .
          rm -rf .maven-repository

          git add .
          git commit -m "action: Publish ${{ steps.tag_version.outputs.new_tag }}" || exit 0
          git push origin maven

  upload:
    name: Create Release
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.build.outputs.new_tag }}
          name: Release ${{ github.ref_name }} ${{ needs.build.outputs.new_tag }}
          body: ${{ needs.build.outputs.changelog }}